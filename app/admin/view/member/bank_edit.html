{include file="public/header" /}
<style>
    .layui-form-selected dl {
        z-index: 1000;
    }
</style>
<body>
<div class="layui-fluid">
    <div class="layui-row">
        <form class="layui-form">
            <input type="hidden" name="id" value="{$id}">
            <div class="layui-form-item">
                <label for="name" class="layui-form-label">银行名称</label>
                <div class="layui-input-inline">
                    <input type="text" id="name" name="name" lay-verify="name"
                           autocomplete="off" class="layui-input" value="{$info.name|default=''}"
                           >
                </div>
            </div>
            <div class="layui-form-item">
                <label for="account_name" class="layui-form-label">银行用户</label>
                <div class="layui-input-inline">
                    <input type="text" id="account_name" name="account_name" lay-verify="account_name"
                           autocomplete="off" class="layui-input" value="{$info.account_name|default=''}"
                           >
                </div>
            </div>
            <div class="layui-form-item">
                <label for="card_no" class="layui-form-label">银行账号</label>
                <div class="layui-input-inline">
                    <input type="text" id="card_no" name="card_no" lay-verify="card_no"
                           autocomplete="off" class="layui-input" value="{$info.card_no|default=''}"
                           >
                </div>
            </div>
            <div class="layui-form-item">
                <label for="name" class="layui-form-label">Wise</label>
                <div class="layui-input-inline">
                    <input type="text" id="wise" name="wise" lay-verify="wise"
                           autocomplete="off" class="layui-input" value="{$info.wise|default=''}"
                           >
                </div>
            </div>
            <div class="layui-form-item">
                <label for="revolut" class="layui-form-label">Revolut</label>
                <div class="layui-input-inline">
                    <input type="text" id="revolut" name="revolut" lay-verify="revolut"
                           autocomplete="off" class="layui-input" value="{$info.revolut|default=''}"
                           >
                </div>
            </div>
            <div class="layui-form-item">
                <label for="usdt" class="layui-form-label">USDT</label>
                <div class="layui-input-inline">
                    <input type="text" id="usdt" name="usdt" lay-verify="usdt"
                           autocomplete="off" class="layui-input" value="{$info.usdt|default=''}"
                           >
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">
                </label>
                <button class="layui-btn" lay-filter="add" lay-submit="">
                    修改
                </button>
            </div>
        </form>
    </div>
</div>
<script type="text/javascript">
    layui.use(['form'], function () {
        var form = layui.form;

        //自定义验证规则
        form.verify({
            // card_no: function (val) {
            //     if (val.length < 1) {
            //         return '不能为空';
            //     }
            // },
        });

        //监听提交
        form.on('submit(add)', function (data) {
            //发异步，把数据提交给php
            $.ajax({
                url: '{:url("admin/Member/bankEdit")}',
                type: 'post',
                data: data.field,
                dataType: 'json',
                success: function (res) {
                    if (res.status == '200') {
                        tipAction(1, res.msg);
                        setTimeout(function () {
                            parent.location.reload();
                        }, 1000);
                    } else {
                        tipAction(2, res.msg);
                    }
                },
                error: function () {
                    tipAction(2, '系统繁忙');
                }
            });
            return false;
        });
    });
</script>
</body>
{include file="public/footer" /}
