{include file="public/header" /}
<style>
    .layui-form-selected dl {
        z-index: 1000;
    }
</style>
<body>
<div class="layui-fluid">
    <div class="layui-row">
        <form class="layui-form">
            <input type="hidden" name="id" value="{$id}">
            <div class="layui-form-item">
                <label for="username" class="layui-form-label">手机号</label>
                <div class="layui-input-inline">
                    <input type="text" id="username" name="username" lay-verify="name"
                           autocomplete="off" class="layui-input" value="{$info.username|default=''}"
                           {if condition="$id gt 0" }{/if}
                    >
                </div>
            </div>
            <div class="layui-form-item">
                <label for="nickname" class="layui-form-label">昵称</label>
                <div class="layui-input-inline">
                    <input type="text" id="nickname" name="nickname" lay-verify="name"
                           autocomplete="off" class="layui-input" value="{$info.nickname|default=''}">
                </div>
            </div>
            <!--<div class="layui-form-item">-->
            <!--    <label for="email" class="layui-form-label">邮箱</label>-->
            <!--    <div class="layui-input-inline">-->
            <!--        <input type="text" id="email" name="email" lay-verify="email"-->
            <!--               autocomplete="off" class="layui-input" value="{$info.email|default=''}">-->
            <!--    </div>-->
            <!--</div>-->
            <div class="layui-form-item">
                <label for="credit_score" class="layui-form-label">信用分</label>
                <div class="layui-input-inline">
                    <input type="number" id="credit_score" name="credit_score" lay-verify="required"
                           autocomplete="off" class="layui-input" value="{$info.credit_score|default='1000'}">
                </div>
            </div>
            {if condition="$id eq 0"}
            <div class="layui-form-item">
                <label for="password" class="layui-form-label">登录密码</label>
                <div class="layui-input-inline">
                    <input type="text" id="password" name="password" lay-verify="name"
                           autocomplete="off" class="layui-input" value="">
                </div>
            </div>
            <div class="layui-form-item">
                <label for="deal_pass" class="layui-form-label">取款密码</label>
                <div class="layui-input-inline">
                    <input type="text" id="deal_pass" name="deal_pass" lay-verify="name"
                           autocomplete="off" class="layui-input" value="">
                </div>
            </div>
            {/if}
            <div class="layui-form-item">
                <label for="level_id" class="layui-form-label">VIP等级</label>
                <div class="layui-input-inline">
                    <select name="level_id" id="level_id">
                        {foreach name="level" item="le"}
                        <option value="{$le.id}" {if condition='$info.level_id eq $le.id'}selected{/if}>{$le.name}</option>
                        {/foreach}
                    </select>
                </div>
            </div>
            <div class="layui-form-item">
                <label for="pid" class="layui-form-label">上级id</label>
                <div class="layui-input-inline">
                    <input type="text" name="pid" id="pid" autocomplete="off" class="layui-input"
                           value="{$info.pid|default='0'}">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label">
                </label>
                <button class="layui-btn" lay-filter="add" lay-submit="">
                    {if condition="$id eq 0"}增加{else/}更新{/if}
                </button>
            </div>
        </form>
    </div>
</div>
<script type="text/javascript">
    layui.use(['form'], function () {
        var form = layui.form;

        //自定义验证规则
        form.verify({
            name: function (val) {
                if (val.length < 2) {
                    return '至少2个字符';
                }
            },
            image: function (val) {
                if (val == '') {
                    return '请上传图片';
                }
            },
        });

        //监听提交
        form.on('submit(add)', function (data) {
            //发异步，把数据提交给php
            $.ajax({
                url: '{:url("admin/Member/userAdd")}',
                type: 'post',
                data: data.field,
                dataType: 'json',
                success: function (res) {
                    if (res.status == '200') {
                        tipAction(1, res.msg);
                        setTimeout(function () {
                            parent.location.reload();
                        }, 1000);
                    } else {
                        tipAction(2, res.msg);
                    }
                },
                error: function () {
                    tipAction(2, '系统繁忙');
                }
            });
            return false;
        });
    });
</script>
</body>
{include file="public/footer" /}
