{include file="public/header" /}
<style>
    .td-hidden-txt {
        text-overflow: ellipsis;
        overflow: hidden;
        white-space: nowrap;
    }
</style>
<body>
<div class="x-nav">
    <a class="layui-btn layui-btn-small" style="line-height:1.6em;margin-top:3px;float:right"
       onclick="location.reload()" title="刷新">
        <i class="layui-icon layui-icon-refresh" style="line-height:30px"></i>
    </a>
</div>
<div class="layui-fluid">
    <div class="layui-row layui-col-space15">
        <div class="layui-col-md12">
            <div class="layui-card">
                <div class="layui-card-body ">
                    <form class="layui-form layui-col-space5" action="{:url('admin/Product/appList')}">
                        <div class="layui-inline layui-show-xs-block">
                            <input type="text" name="name" placeholder="请输入关键词" autocomplete="off"
                                   class="layui-input" value="{$name}">
                        </div>
                        <div class="layui-input-inline layui-show-xs-block">
                            <input type="text" name="start_time" placeholder="开始时间" autocomplete="off" readonly
                                   id="start_time" value="{$start_time}" class="layui-input">
                        </div>
                        <div class="layui-inline layui-show-xs-block">
                            <button class="layui-btn" lay-filter="sreach">
                                <i class="layui-icon">&#xe615;</i>
                            </button>
                        </div>
                    </form>
                </div>
                <div class="layui-card-header">
                    <button class="layui-btn layui-btn-danger" onclick="disAll()">批量删除</button>
                    <a class="layui-btn" href="{:url('admin/Product/appAdd')}">
                        <i class="layui-icon"></i>添加APP
                    </a>
                    <span style="float: right">共有数据：{$list->total()} 条</span>
                </div>
                <div class="layui-card-body" style="overflow-x: auto">
                    <table class="layui-table layui-form">
                        <thead>
                        <tr>
                            <th width="3%">
                                <input type="checkbox" lay-filter="checkall" name="" lay-skin="primary">
                            </th>
                            <th width="5%">ID</th>
                            <th width="10%">图片</th>
                            <th>名称</th>
                            <th>创建时间</th>
                            <th width="10%">操作</th>
                        </thead>
                        <tbody>
                        {foreach name="list" item="vo"}
                        <tr>
                            <td>
                                <input type="checkbox" name="aid" value="{$vo.id}" lay-skin="primary">
                            </td>
                            <td>{$vo.id}</td>
                            <td title="点击放大"><img src="{$vo.img}" onclick="showBig(this)"></td>
                            <td>{$vo.name}</td>
                            <td>{$vo.create_time}</td>
                            <td class="td-manage">
                                <a class="layui-btn layui-btn-mini"
                                   href="{:url('admin/Product/appAdd',['id'=>$vo['id']])}">
                                    编辑
                                </a>
                            </td>
                        </tr>
                        {/foreach}
                        </tbody>
                    </table>
                </div>
                <div class="layui-card-body">
                    <div class="page">
                        {$list|raw}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<script type="text/javascript">
    layui.use(['form', 'laydate'], function () {
        var laydate = layui.laydate;
        var  form = layui.form;
        laydate.render({
            elem: '#start_time', //指定元素
            type: 'datetime',
        });
        // 监听全选
        form.on('checkbox(checkall)', function(data){
            if(data.elem.checked){
                $('tbody input').prop('checked',true);
            }else{
                $('tbody input').prop('checked',false);
            }
            form.render('checkbox');
        });
    });

    //批量删除
    function disAll() {
        layer.confirm('确认要删除吗？', function (index) {
            //发异步删除数据
            var id_arr = [];
            $('input[name="aid"]:checked').each(function () {
                id_arr.push(this.value);
            });
            if (id_arr.length > 0) {
                $.ajax({
                    url: '{:url("admin/Product/appDel")}',
                    type: 'post',
                    data: {'ids': id_arr},
                    dataType: 'json',
                    success: function (res) {
                        if (res.status == '200') {
                            tipAction(1, res.msg);
                            $('input[name="aid"]:checked').each(function () {
                                $(this).parent().parent().remove();
                            });
                        } else {
                            tipAction(2, res.msg);
                        }
                    },
                    error: function () {
                        tipAction(2, '系统繁忙');
                    }
                });
            }
            layer.close(index);
        });
    }
</script>
{include file="public/footer" /}
