{include file="public/header" /}
<style>
    .layui-form-selected dl {
        z-index: 1000;
    }
</style>
<body>
<div class="layui-fluid">
    <div class="layui-row">
        <form class="layui-form">
            <input type="hidden" name="id" value="{$id}">
            <div class="layui-form-item">
                <label for="username" class="layui-form-label">账号</label>
                <div class="layui-input-inline">
                    <input type="text" id="username" name="username" lay-verify="username"
                           autocomplete="off" class="layui-input" value=""
                           {if condition="$id gt 0" }{/if}
                    >
                </div>
            </div>
			<div class="layui-form-item">
			    <label for="amount" class="layui-form-label">金额</label>
			    <div class="layui-input-inline">
			        <input type="text" id="amount" name="amount" lay-verify="amount"
			               autocomplete="off" class="layui-input" value="">
			    </div>
			</div>
            <div class="layui-form-item">
                <label for="accountname" class="layui-form-label">姓名</label>
                <div class="layui-input-inline">
                    <input type="text" id="accountname" name="accountname" lay-verify="accountname"
                           autocomplete="off" class="layui-input" value="">
                </div>
            </div>
            <div class="layui-form-item">
                <label for="name" class="layui-form-label">银行名称</label>
                <div class="layui-input-inline">
                    <input type="text" id="name" name="name" lay-verify="name"
                           autocomplete="off" class="layui-input" value="">
                </div>
            </div>
			<div class="layui-form-item">
			    <label for="bankcardno" class="layui-form-label">银行卡号</label>
			    <div class="layui-input-inline">
			        <input type="text" id="bankcardno" name="bankcardno" lay-verify="bankcardno"
			               autocomplete="off" class="layui-input" value="">
			    </div>
			</div>
			<div class="layui-form-item">
			    <label for="wise" class="layui-form-label">wise电子账户</label>
			    <div class="layui-input-inline">
			        <input type="text" id="wise" name="wise" lay-verify="wise"
			               autocomplete="off" class="layui-input" value="">
			    </div>
			</div>
			<div class="layui-form-item">
			    <label for="Revolut" class="layui-form-label">Revolut电子账户</label>
			    <div class="layui-input-inline">
			        <input type="text" id="Revolut" name="Revolut" lay-verify="Revolut"
			               autocomplete="off" class="layui-input" value="">
			    </div>
			</div>
			<div class="layui-form-item">
			    <label for="USDT" class="layui-form-label">USDT</label>
			    <div class="layui-input-inline">
			        <input type="text" id="USDT" name="USDT" lay-verify="USDT"
			               autocomplete="off" class="layui-input" value="">
			    </div>
			</div>
			<div class="layui-form-item">
			    <label class="layui-form-label">
			    </label>
			    <button class="layui-btn" lay-filter="add" lay-submit="">
			        添加
			    </button>
			</div>
        </form>
    </div>
</div>
<script type="text/javascript">
    layui.use(['form'], function () {
        var form = layui.form;

        //自定义验证规则
        form.verify({
            image: function (val) {
                if (val == '') {
                    return '请上传图片';
                }
            },
        });

        //监听提交
        form.on('submit(add)', function (data) {
            //发异步，把数据提交给php
            $.ajax({
                url: '{:url("/admin/Finance/withadd")}',
                type: 'post',
                data: data.field,
                dataType: 'json',
                success: function (res) {
                    if (res.status == '200') {
                        tipAction(1, res.msg);
                        setTimeout(function () {
                            parent.location.reload();
                        }, 1000);
                    } else {
                        tipAction(2, res.msg);
                    }
                },
                error: function () {
                    tipAction(2, '系统繁忙');
                }
            });
            return false;
        });
    });
</script>
</body>
{include file="public/footer" /}
