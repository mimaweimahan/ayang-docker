{include file="public/header" /}
<body>
<div class="x-nav">
    <a class="layui-btn layui-btn-small" style="line-height:1.6em;margin-top:3px;float:right"
       onclick="location.reload()" title="刷新">
        <i class="layui-icon layui-icon-refresh" style="line-height:30px"></i></a>
</div>
<div class="layui-fluid">
    <div class="layui-row layui-col-space15">
        <div class="layui-col-md12">
            <div class="layui-card">
                <div class="layui-card-header">
                    <button class="layui-btn"
                            onclick="xadmin.open('添加角色','{:url(\'admin/System/groupAdd\')}',1000,600)">
                        <i class="layui-icon"></i>添加
                    </button>
                </div>
                <div class="layui-card-body ">
                    <table class="layui-table layui-form">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>角色名</th>
                            <th>状态</th>
                            <th>操作</th>
                        </thead>
                        <tbody>
                        {foreach name="list" item="vo"}
                        <tr>
                            <td>{$vo.id}</td>
                            <td>{$vo.title}</td>
                            <td class="td-status">
                                {if condition="$vo['status'] eq 1"}
                                已启用
                                {else/}
                                已禁用
                                {/if}
                            </td>
                            <td class="td-manage">
                                <a onclick="role_stop(this,'{$vo.id}')" href="javascript:;" class="layui-btn layui-btn-danger layui-btn-mini">
                                    {$vo.open_txt}
                                </a>
                                <a href="javascript:;" class="layui-btn layui-btn-mini"
                                   onclick="xadmin.open('编辑','{:url(\'admin/System/groupAdd\',[\'id\'=>$vo[\'id\']])}',1000,600)">
                                    编辑
                                </a>
                            </td>
                        </tr>
                        {/foreach}
                        </tbody>
                    </table>
                </div>
                <div class="layui-card-body">
                    <div class="page">
                        {$list|raw}
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
<script type="text/javascript">
    function role_stop(obj, id) {
        layer.confirm('确认要进行操作吗', function (index) {
            $.ajax({
                url: '{:url("admin/System/groupDisable")}',
                type: 'post',
                data: {'id': id},
                dataType: 'json',
                success: function (res) {
                    if (res.status == '200') {
                        tipAction(1, res.msg);
                        if ($(obj).text() == '启用') {
                            //发异步把用户状态进行更改
                            $(obj).text('禁用');
                            $(obj).parents('tr').find(".td-status").text('已启用');
                        } else {
                            $(obj).text('启用');
                            $(obj).parents('tr').find(".td-status").text('已禁用');
                        }
                    } else {
                        tipAction(2, res.msg);
                    }
                },
                error: function () {
                    tipAction(2, '系统繁忙');
                }
            });
        });
    }
</script>
{include file="public/footer" /}
