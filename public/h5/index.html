			})</script><link rel=stylesheet href=/static/index.css></head><body><noscript><strong>本站点必须要开启JavaScript才能运行</strong></noscript><div id=welcome-overlay class=welcome-overlay><div class=countdown-display id=countdown>3s</div></div><div id=app></div><script>/*BAIDU_STAT*/
			
			// 欢迎页面逻辑
			(function() {
				let countdown = 3;
				const overlay = document.getElementById('welcome-overlay');
				const countdownEl = document.getElementById('countdown');
				
				// 检查是否已登录（从localStorage）
				function checkLoginStatus() {
					try {
						const lifeData = localStorage.getItem('lifeData');
						if (lifeData) {
							const data = JSON.parse(lifeData);
							if (data.vuex_authorization && data.vuex_authorization.length > 0) {
								return true;
							}
						}
						
						// 检查直接存储的token
						const directToken = localStorage.getItem('vuex_authorization');
						if (directToken && directToken.length > 0) {
							return true;
						}
					} catch (e) {
						console.log('检查登录状态出错:', e);
					}
					return false;
				}
				
				// 倒计时函数
				function startCountdown() {
					const timer = setInterval(function() {
						countdown--;
						countdownEl.textContent = countdown + 's';
						
						if (countdown <= 0) {
							clearInterval(timer);
							// 淡出效果
							overlay.classList.add('fade-out');
							setTimeout(function() {
								overlay.style.display = 'none';
							}, 500);
						}
					}, 1000);
				}
				
				// 页面加载完成后开始倒计时
				window.addEventListener('load', function() {
					// 如果已登录，直接隐藏欢迎页
					if (checkLoginStatus()) {
						overlay.style.display = 'none';
						return;
					}
					
					// 未登录，开始倒计时
					startCountdown();
				});
			})();</script><script src=/static/js/chunk-vendors.cf2429ff.js></script><script src=/static/js/index.413e14bd.js></script></body></html>
