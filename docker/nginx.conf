server {
    # 默认 8088，避免与 aaPanel 宿主机 Nginx:80 冲突；面板可反代到此端口
    listen 8088;
    server_name _;
    root /var/www/ayang/public;
    index index.php index.html;

    client_max_body_size 50m;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|LICENSE|README.md) {
        return 404;
    }

    location ~* (runtime|application)/ {
        return 403;
    }

    location / {
        if (!-e $request_filename) {
            rewrite ^(.*)$ /index.php?s=$1 last;
            break;
        }
    }

    # 支持 ThinkPHP PATHINFO：/xxx.php/Login/index.html
    location ~ [^/]\.php(/|$) {
        # 拆分 script 与 pathinfo（对齐宝塔 pathinfo.conf）
        set $real_script_name $fastcgi_script_name;
        set $path_info "";
        if ($fastcgi_script_name ~ "^(.+?\.php)(/.+)$") {
            set $real_script_name $1;
            set $path_info $2;
        }

        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$real_script_name;
        fastcgi_param SCRIPT_NAME $real_script_name;
        fastcgi_param PATH_INFO $path_info;
        fastcgi_read_timeout 300;
    }

    location ~* \.(gif|jpg|jpeg|png|bmp|swf|ico|svg|webp)$ {
        expires 30d;
        access_log off;
    }

    location ~* \.(js|css)$ {
        expires 12h;
        access_log off;
    }

    access_log /var/log/nginx/ayang.access.log;
    error_log  /var/log/nginx/ayang.error.log;
}
